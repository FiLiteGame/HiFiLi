<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Xe Bán Kem - Ice Cream Stand</title>
    <link
      href="https://fonts.googleapis.com/css2?family=VT323&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        box-sizing: border-box;
        user-select: none;
      }

      body {
        margin: 0;
        padding: 0;
        background-color: #1a1c2c;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        font-family: "VT323", monospace;
        overflow: hidden;
      }

      /* Khung game 800x600 chuẩn Pixel Retro */
      #game-container {
        position: relative;
        width: 800px;
        height: 600px;
        border: 6px solid #111;
        box-shadow:
          0 0 0 4px #ff69b4,
          0 20px 40px rgba(0, 0, 0, 0.8);
        background-color: #fff0f5;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }

      /* 1. THANH TRÊN CÙNG */
      .top-bar {
        height: 50px;
        background-color: #1a1c2c;
        border-bottom: 4px solid #111;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 20px;
        color: #fff;
        font-size: 24px;
      }

      .badge-money {
        background-color: #4caf50;
        padding: 2px 10px;
        border: 2px solid #111;
        box-shadow: 2px 2px 0 #111;
      }

      .btn-back {
        background-color: #e74c3c;
        color: #fff;
        border: 2px solid #111;
        padding: 2px 14px;
        font-family: "VT323", monospace;
        font-size: 22px;
        cursor: pointer;
        box-shadow: 2px 2px 0 #111;
      }
      .btn-back:active {
        transform: translateY(2px);
        box-shadow: 0 0 0 #111;
      }

      /* 2. KHU VỰC CHÍNH (XE KEM & THỰC ĐƠN) */
      .ice-layout {
        flex: 1;
        display: flex;
        flex-direction: column;
        padding: 20px;
        gap: 15px;
        align-items: center;
        justify-content: center;
      }

      /* Hộp thoại nhân vật đói bụng (Chuẩn phong cách Pokémon / RPG) */
      .character-dialog {
        width: 100%;
        max-width: 650px;
        background: #f8f8f8;
        border: 4px solid #1d266b;
        box-shadow:
          inset 0 0 0 2px #fff,
          0 6px 0 rgba(0, 0, 0, 0.4);
        padding: 15px 20px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .dialog-title {
        font-size: 22px;
        font-weight: bold;
        color: #d81b60;
      }

      .dialog-text {
        font-size: 26px;
        color: #282828;
        line-height: 1.2;
      }

      /* Bảng thực đơn các loại kem */
      .menu-grid {
        width: 100%;
        max-width: 650px;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
      }

      .ice-card {
        background: #fff;
        border: 3px solid #333;
        padding: 12px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        box-shadow: 3px 3px 0 rgba(0, 0, 0, 0.2);
      }

      .ice-info {
        display: flex;
        flex-direction: column;
      }

      .ice-name {
        font-size: 22px;
        font-weight: bold;
        color: #d81b60;
      }

      .ice-price {
        font-size: 18px;
        color: #c0392b;
      }

      .btn-buy-ice {
        background-color: #ffde00;
        color: #111;
        border: 2px solid #111;
        padding: 4px 12px;
        font-family: "VT323", monospace;
        font-size: 20px;
        font-weight: bold;
        cursor: pointer;
        box-shadow: 2px 2px 0 #111;
      }
      .btn-buy-ice:hover {
        background-color: #ffee55;
      }
      .btn-buy-ice:active {
        transform: translateY(2px);
        box-shadow: 0 0 0 #111;
      }

      /* Nút từ chối mua để tiết kiệm tiền */
      .btn-refuse {
        width: 100%;
        max-width: 650px;
        background-color: #95a5a6;
        color: #fff;
        border: 3px solid #111;
        padding: 8px;
        font-family: "VT323", monospace;
        font-size: 24px;
        font-weight: bold;
        cursor: pointer;
        box-shadow: 3px 3px 0 #111;
        text-align: center;
      }
      .btn-refuse:hover {
        background-color: #7f8c8d;
      }
      .btn-refuse:active {
        transform: translateY(2px);
        box-shadow: 1px 1px 0 #111;
      }

      /* Thanh thông báo */
      .notification-bar {
        height: 40px;
        background-color: #111;
        color: #ffde00;
        display: flex;
        align-items: center;
        padding: 0 20px;
        font-size: 20px;
      }
    </style>
  </head>
  <body>
    <div id="game-container">
      <!-- THANH TRÊN CÙNG -->
      <div class="top-bar">
        <div>🍦 <b>Xe Bán Kem Ngọt Ngào</b></div>
        <div style="display: flex; align-items: center; gap: 15px">
          <span class="badge-money"
            >💰 $<span id="balance-display">15.00</span></span
          >
          <button class="btn-back" onclick="goToMap()">⬅ Về Bản Đồ</button>
        </div>
      </div>

      <!-- KHU VỰC GIAO DIỆN XE KEM -->
      <div class="ice-layout">
        <!-- Hộp thoại nhân vật đói bụng -->
        <div class="character-dialog">
          <div class="dialog-title">💬 TÂM TRẠNG NHÂN VẬT</div>
          <div class="dialog-text" id="dialog-msg">
            "Hừm... đi bộ quanh thị trấn mệt quá, bụng bắt đầu thấy đói và thèm
            một cây kem mát lạnh rồi đây! Có nên tạt vào mua không nhỉ?"
          </div>
        </div>

        <!-- Thực đơn kem (Dâu, Socola, Vani, Matcha, Cốm) -->
        <div class="menu-grid" id="ice-menu">
          <!-- Được render bằng JavaScript -->
        </div>

        <!-- Nút từ chối mua để tiết kiệm tiền -->
        <button class="btn-refuse" onclick="refuseBuying()">
          ❌ Thôi không mua nữa (Tiết kiệm tiền về nhà)
        </button>
      </div>

      <!-- THANH THÔNG BÁO -->
      <div class="notification-bar" id="notification-text">
        Mẹo: Mua kem giúp nhân vật giải tỏa cơn đói, nhưng hãy cân nhắc tài
        chính để hoàn thành mục tiêu vòng 1 nhé!
      </div>
    </div>

    <script>
      // 1. DỮ LIỆU TÀI CHÍNH VÀ KHO ĐỒ
      let balance = parseFloat(localStorage.getItem("playerBalance")) || 15.0;
      let inventory = JSON.parse(localStorage.getItem("playerInventory")) || {};

      document.getElementById("balance-display").textContent =
        balance.toFixed(2);

      // Danh sách các loại kem (Giá hợp lý từ $0.8 đến $1.5)
      const iceCreams = [
        { id: "strawberry", name: "🍓 Kem Dâu Tươi", price: 1.0 },
        { id: "chocolate", name: "🍫 Kem Socola Đậm Đà", price: 1.2 },
        { id: "vanilla", name: "🍦 Kem Vani Truyền Thống", price: 0.8 },
        { id: "matcha", name: "🍵 Kem Matcha Trà Xanh", price: 1.5 },
        { id: "green_rice", name: "🟢 Kem Cốm Non", price: 1.1 },
      ];

      // 2. HIỂN THỊ THỰC ĐƠN KEM
      function renderMenu() {
        const menuGrid = document.getElementById("ice-menu");
        menuGrid.innerHTML = "";

        iceCreams.forEach((ice) => {
          menuGrid.innerHTML += `
                <div class="ice-card">
                    <div class="ice-info">
                        <span class="ice-name">${ice.name}</span>
                        <span class="ice-price">$${ice.price.toFixed(2)}</span>
                    </div>
                    <button class="btn-buy-ice" onclick="buyIceCream('${ice.name}', ${ice.price})">Mua Ngay</button>
                </div>
            `;
        });
      }

      // 3. XỬ LÝ MUA KEM
      function buyIceCream(name, price) {
        if (balance < price) {
          showNotification(
            `❌ Không đủ tiền! Bạn chỉ còn $${balance.toFixed(2)} trong tài khoản.`,
          );
          document.getElementById("dialog-msg").textContent =
            `"Ái chà, ví tiền không đủ để mua ${name} rồi... Thôi đành nhịn đói vậy!"`;
          return;
        }

        // Trừ tiền
        balance -= price;
        localStorage.setItem("playerBalance", balance.toFixed(2));
        document.getElementById("balance-display").textContent =
          balance.toFixed(2);

        // Thêm vào kho đồ ăn nhẹ
        if (!inventory[name]) {
          inventory[name] = 0;
        }
        inventory[name] += 1;
        localStorage.setItem("playerInventory", JSON.stringify(inventory));

        // Cập nhật lời thoại nhân vật khi mua xong
        document.getElementById("dialog-msg").textContent =
          `"Ngon tuyệt! Ăn một cây ${name} mát lạnh thấy tỉnh cả người, hết đói hẳn luôn rồi!"`;
        showNotification(
          `✅ Đã mua thành công ${name} với giá $${price.toFixed(2)}!`,
        );
      }

      // 4. XỬ LÝ TỪ CHỐI MUA (TIẾT KIỆM TIỀN)
      function refuseBuying() {
        document.getElementById("dialog-msg").textContent =
          `"Thôi, để dành tiền đầu tư và kinh doanh kiếm lời quan trọng hơn. Về nhà uống nước lọc cho lành!"`;
        showNotification(
          "💡 Bạn đã chọn từ chối mua kem để tiết kiệm tiền tài chính.",
        );
      }

      function showNotification(text) {
        document.getElementById("notification-text").textContent = text;
      }

      function goToMap() {
        window.location.href = "map.html";
      }

      // Khởi chạy khi tải trang
      renderMenu();
    </script>
  </body>
</html>
