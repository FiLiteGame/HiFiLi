      name="description"
      content="FiLite là trò chơi mô phỏng kinh tế vi mô, khởi nghiệp Startup và đầu tư chứng khoán tại thành phố ven biển FiCity dành cho học sinh, sinh viên."

    <style>
      :root {
        --pixel-border: #1e293b;
        --card-bg: #fffdf7;
      }
      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }
      body {
        font-family: "Be Vietnam Pro", sans-serif;
        background: linear-gradient(
          180deg,
          #e0f2fe 0%,
          #f0f9ff 45%,
          #fefce8 100%
        );
        color: #0f172a;
        margin: 0;
        padding: 0;
        overflow-x: hidden;
        min-height: 100vh;
      }
      .font-retro {
        font-family: "Chakra Petch", sans-serif;
        letter-spacing: 0.02em;
      }
      .pixel-box {
        background-color: var(--card-bg);
        border: 3px solid var(--pixel-border);
        box-shadow: 4px 4px 0px var(--pixel-border);
        border-radius: 12px;
      }
      .pixel-box-sm {
        background-color: #ffffff;
        border: 2px solid var(--pixel-border);
        box-shadow: 2px 2px 0px var(--pixel-border);
        border-radius: 10px;
      }
      .pixel-btn {
        border: 2px solid var(--pixel-border);
        box-shadow: 0px 3px 0px var(--pixel-border);
        transition:
          transform 0.08s ease,
          box-shadow 0.08s ease,
          filter 0.12s ease;
        font-weight: 700;
        border-radius: 10px;
        cursor: pointer;
        user-select: none;
      }
      .pixel-btn:hover:not(:disabled) {
        filter: brightness(1.04);
        transform: translateY(-1px);
        box-shadow: 0px 4px 0px var(--pixel-border);
      }
      .pixel-btn:active:not(:disabled) {
        transform: translateY(2px);
        box-shadow: 0px 1px 0px var(--pixel-border);
      }
      .pixel-btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
        box-shadow: none;
        transform: translateY(2px);
      }
      #cityCanvas {
        display: block;
        width: 100%;
        height: 100%;
        image-rendering: pixelated;
        cursor: pointer;
        touch-action: manipulation;
      }
      .phone-frame {
        background: #1e293b;
        border: 4px solid #0f172a;
        border-radius: 28px;
        box-shadow: 6px 6px 0px rgba(15, 23, 42, 0.25);
        padding: 10px;
      }
      .phone-screen {
        background: #f8fafc;
        border: 2px solid #334155;
        border-radius: 20px;
        overflow: hidden;
        display: flex;
        flex-direction: column;
      }
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: #f1f5f9;
        border-radius: 6px;
      }
      ::-webkit-scrollbar-thumb {
        background: #94a3b8;
        border-radius: 6px;
      }
      @keyframes floatUp {
        0% {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
        100% {
          opacity: 0;
          transform: translateY(-42px) scale(1.08);
        }
      }
      .float-feedback {
        animation: floatUp 1.3s ease-out forwards;
        pointer-events: none;
      }
      @keyframes pulseDot {
        0%,
        100% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.25);
        }
      }
      .notif-dot {
        animation: pulseDot 1.2s infinite;
      }
      @keyframes popIn {
        0% {
          opacity: 0;
          transform: scale(0.93);
        }
        100% {
          opacity: 1;
          transform: scale(1);
        }
      }
      .modal-pop {
        animation: popIn 0.18s ease-out;
      }
      .mg-tile {
        border: 3px solid #1e293b;
        box-shadow: 0 3px 0 #1e293b;
        transition: transform 0.06s;
        user-select: none;
      }
      .mg-tile:active {
        transform: translateY(2px);
        box-shadow: 0 1px 0 #1e293b;
      }
    </style>

      // ==================== 7. AUDIO SYNTH (VERSION 1 8-BIT SFX) ====================
      let audioCtx = null;
      function playTone(
        freq,
        dur = 0.08,
        type = "square",
        vol = 0.05,
        delay = 0,
      ) {
        if (!state.soundOn) return;
        try {
          if (!audioCtx)
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
          if (audioCtx.state === "suspended") audioCtx.resume();
          const osc = audioCtx.createOscillator(),
            gain = audioCtx.createGain();
          osc.type = type;
          osc.frequency.setValueAtTime(freq, audioCtx.currentTime + delay);
          gain.gain.setValueAtTime(vol, audioCtx.currentTime + delay);
          gain.gain.exponentialRampToValueAtTime(
            0.001,
            audioCtx.currentTime + delay + dur,
          );
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(audioCtx.currentTime + delay);
          osc.stop(audioCtx.currentTime + delay + dur + 0.01);
        } catch (e) {}
      }

async function syncScoreToOnline(entry) {
  if (!isOnlineDbConfigured()) {
    console.error("Supabase chưa được cấu hình URL hoặc KEY!");
    return false;
  }

  try {
    const res = await fetch(
      `${ONLINE_DB_CONFIG.SUPABASE_URL}/rest/v1/player_stats`,
      {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          apikey: ONLINE_DB_CONFIG.SUPABASE_KEY,
          Authorization: `Bearer ${ONLINE_DB_CONFIG.SUPABASE_KEY}`,
          Prefer: "return=minimal",
        },
        body: JSON.stringify({
          name: entry.name,
          gender: entry.gender,
          level: entry.level,
          day: entry.day,
          cash: entry.cash,
        }),
      },
    );

    if (!res.ok) {
      const errorText = await res.text();
      console.error("Lỗi khi lưu điểm lên Supabase:", res.status, errorText);
      return false;
    }

    console.log("Đã lưu điểm lên Supabase thành công!");
    return true;

  } catch (e) {
    console.error("Lỗi kết nối Supabase:", e);
    return false;
  }
}

          let p = s.start;
          for (let i = 0; i < 5; i++) {
            const o = p;
            const move = Math.round((Math.random() - 0.48) * s.start * 0.12);
            const c = i === 4 ? s.start : Math.max(8, o + move);
            const h = Math.max(o, c) + Math.ceil(Math.random() * 3);
            const l = Math.max(
              4,

            );
            arr.push({ day: i - 4, o, h, l, c });
            p = c;

      function setupCanvas() {
        canvas = document.getElementById("cityCanvas");
        ctx = canvas.getContext("2d");
        resizeCanvas();
        window.addEventListener("resize", resizeCanvas);
        canvas.addEventListener("mousemove", (e) => {
          const pt = getCanvasPt(e);
          hoveredLocId = hitTestLoc(pt.x, pt.y) || hitTestDeco(pt.x, pt.y);
          canvas.style.cursor = hoveredLocId ? "pointer" : "default";
        });
        canvas.addEventListener("mouseleave", () => (hoveredLocId = null));
        canvas.addEventListener("click", (e) => {
          if (state.isTraveling || state.gameEnded) return;

            SFX.miss();

              `${d.icon} ${state.lang === "vi" ? d.vi : d.en}: ${t("unavailableMsg")}`,
              "warn",
            );
            return;
          }
          const id = hitTestLoc(pt.x, pt.y);
          if (id) {
            const loc = LOCATIONS[id];
            if (state.level < (loc.minLv || 1)) {
              SFX.miss();
              showToast(t("lockedLocMsg")(loc.minLv), "warn");
              return;

      function resizeCanvas() {
        const wrap = document.getElementById("canvasWrapper");
        if (!wrap || !canvas) return;
        canvas.width = CANVAS_W;
        canvas.height = CANVAS_H;
        canvas.style.width = wrap.clientWidth + "px";
        canvas.style.height = wrap.clientHeight + "px";
        ctx.imageSmoothingEnabled = false;
      }
      function getCanvasPt(e) {
        const r = canvas.getBoundingClientRect();
        return {
          x: ((e.clientX - r.left) / r.width) * CANVAS_W,
          y: ((e.clientY - r.top) / r.height) * CANVAS_H,
        };
      }
      function hitTestLoc(x, y) {
        for (const loc of Object.values(LOCATIONS)) {
          if (
            x >= loc.x - loc.w / 2 - 4 &&
            x <= loc.x + loc.w / 2 + 4 &&
            y >= loc.y - loc.h / 2 - 8 &&
            y <= loc.y + loc.h / 2 + 16
          )
            return loc.id;
        }
        return null;
      }
      function hitTestDeco(x, y) {
        for (const d of DECO_PLACES) {
          if (
            x >= d.x - d.w / 2 - 2 &&
            x <= d.x + d.w / 2 + 2 &&
            y >= d.y - d.h / 2 - 6 &&
            y <= d.y + d.h / 2 + 16
          )
            return d.id;
        }
        return null;
      }
      function pxRect(x, y, w, h, c) {
        ctx.fillStyle = c;
        ctx.fillRect(
          Math.round(x),
          Math.round(y),
          Math.round(w),
          Math.round(h),
        );
      }

      function drawTree(x, y, fruit = false, sway = 0) {
        pxRect(x - 7, y + 8, 15, 4, "rgba(15,23,42,0.18)");
        pxRect(x - 2, y, 5, 10, "#78350f");
        const s = Math.round(sway);
        pxRect(x - 10 + s, y - 12, 20, 12, "#15803d");
        pxRect(x - 8 + s, y - 16, 16, 11, "#16a34a");
        pxRect(x - 5 + s, y - 14, 9, 5, "#22c55e");
        if (fruit) {
          pxRect(x - 5 + s, y - 8, 3, 3, "#ef4444");
          pxRect(x + 3 + s, y - 11, 3, 3, "#f97316");
        }
      }
      function drawCloud(x, y, s, dark) {
        pxRect(x, y + 6 * s, 44 * s, 10 * s, dark ? "#64748b" : "#e2e8f0");
        pxRect(
          x + 4 * s,
          y + 2 * s,
          36 * s,
          10 * s,
          dark ? "#94a3b8" : "#ffffff",
        );
        pxRect(
          x + 12 * s,
          y - 4 * s,
          20 * s,
          10 * s,
          dark ? "#94a3b8" : "#ffffff",
        );

      function drawSign(loc, isDeco = false) {

        const isHover = hoveredLocId === loc.id,

        if (isHover || isCur) {
          ctx.save();
          ctx.strokeStyle = isCur ? "#f59e0b" : locked ? "#ef4444" : "#ffffff";
          ctx.lineWidth = 3;
          ctx.setLineDash(isCur ? [] : [5, 4]);
          ctx.strokeRect(
            loc.x - loc.w / 2 - 3,
            loc.y - loc.h / 2 - 5,
            loc.w + 6,
            loc.h + 8,
          );
          ctx.restore();
        }
        const lbl = `${locked ? "🔒" : loc.icon} ${state.lang === "vi" ? loc.shortVi : loc.shortEn}`;
        ctx.font = 'bold 10px "Chakra Petch", sans-serif';
        const tw = ctx.measureText(lbl).width + 10;
        const sx = Math.round(loc.x - tw / 2),
          sy = Math.round(loc.y + loc.h / 2 + 3);
        pxRect(sx, sy, tw, 16, "#1e293b");
        pxRect(
          sx + 1,
          sy + 1,
          tw - 2,
          14,
          locked
            ? "#e2e8f0"
            : isCur
              ? "#fef08a"
              : isHover
                ? "#e0f2fe"
                : "#ffffff",
        );
        ctx.fillStyle = locked ? "#64748b" : "#0f172a";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(lbl, loc.x, sy + 8);
      }

      function updatePlayerAnim() {
        if (playerAnim.tpFx > 0) playerAnim.tpFx--;
        if (!playerAnim.moving) return;
        if (playerAnim.waypoints.length === 0) {
          playerAnim.moving = false;
          if (playerAnim.onArrive) {
            const cb = playerAnim.onArrive;
            playerAnim.onArrive = null;
            cb();
          }
          return;
        }
        const wp = playerAnim.waypoints[0];
        const dx = wp.x - playerAnim.x,
          dy = wp.y - playerAnim.y,
          dist = Math.hypot(dx, dy);
        if (dx !== 0) playerAnim.facing = dx >= 0 ? 1 : -1;
        if (dist <= 4.0) {
          playerAnim.x = wp.x;
          playerAnim.y = wp.y;
          playerAnim.waypoints.shift();
        } else {
          playerAnim.x += (dx / dist) * 4.0;
          playerAnim.y += (dy / dist) * 4.0;
          if (animTick % 12 === 0) SFX.walk();
        }
      }

      function drawPlayer() {
        const px = Math.round(playerAnim.x),
          py = Math.round(playerAnim.y);
        const bob = playerAnim.moving
          ? Math.abs(Math.sin(animTick * 0.45)) * 3
          : Math.sin(animTick * 0.1) * 1;
        if (playerAnim.tpFx > 0) {
          ctx.save();
          ctx.strokeStyle = "#22d3ee";
          ctx.lineWidth = 3;
          ctx.beginPath();
          ctx.arc(px, py - 10, 10 + (22 - playerAnim.tpFx), 0, Math.PI * 2);
          ctx.stroke();
          ctx.restore();
        }
        pxRect(px - 8, py + 2, 16, 5, "rgba(15,23,42,0.35)");
        const leg = playerAnim.moving
          ? Math.round(Math.sin(animTick * 0.45) * 3)
          : 0;
        pxRect(px - 5, py - 6 - bob + leg, 4, 8, "#1e3a8a");
        pxRect(px + 1, py - 6 - bob - leg, 4, 8, "#1e3a8a");
        const hoodie = state.isExhausted
          ? "#94a3b8"
          : state.player.gender === "female"
            ? "#ec4899"
            : state.player.gender === "other"
              ? "#8b5cf6"
              : "#2563eb";
        pxRect(px - 7, py - 18 - bob, 14, 13, hoodie);
        pxRect(px - 6, py - 29 - bob, 12, 11, "#fed7aa");
        pxRect(px - 7, py - 32 - bob, 14, 5, "#1e293b");
        pxRect(
          px + (playerAnim.facing > 0 ? 1 : -4),
          py - 25 - bob,
          2,
          3,
          "#0f172a",
        );
        const ay = py - 40 - Math.round(Math.sin(animTick * 0.14) * 2);
        pxRect(px - 4, ay, 8, 3, "#f59e0b");
        pxRect(px - 2, ay + 3, 4, 3, "#f59e0b");

        const dest = LOCATIONS[destId];

          SFX.miss();
          showToast(t("lockedLocMsg")(dest.minLv), "warn");
          return;
        }
        const name = state.lang === "vi" ? dest.vi : dest.en;
        const canTp = state.cash >= 3;
        openModal(`

        <button id="btnWalk" class="pixel-btn mt-3 w-full py-2 bg-amber-400 text-slate-900 text-xs">${t("walkTitle")}</button>
      </div>
      <div class="pixel-box-sm p-3 bg-cyan-50 flex flex-col justify-between">

        <button id="btnTp" ${!canTp ? "disabled" : ""} class="pixel-btn mt-3 w-full py-2 bg-cyan-400 text-slate-900 text-xs">${canTp ? t("tpTitle") : t("notEnough")}</button>
      </div>
    </div>
  `);
        document.getElementById("mClose").addEventListener("click", closeModal);
        document.getElementById("btnWalk").addEventListener("click", () => {
          closeModal();
          travelTo(destId, "walk");
        });
        document.getElementById("btnTp").addEventListener("click", () => {
          closeModal();
          travelTo(destId, "teleport");
        });
      }

      function travelTo(destId, mode) {
        if (state.isTraveling) return;
        const dest = LOCATIONS[destId];
        if (mode === "teleport") {
          if (state.cash < 3) {
            showToast(t("notEnough"), "error");
            return;
          }
          state.cash -= 3;
          addTx(
            `Teleport đến ${dest.shortVi}`,
            `Teleport to ${dest.shortEn}`,
            -3,
          );
          SFX.tp();
          playerAnim.x = dest.doorX;
          playerAnim.y = dest.doorY;
          playerAnim.tpFx = 22;
          state.location = destId;
          spawnFloat("⚡ -3 Fi", "#06b6d4");
          saveGame();
          renderAll();
          return;
        }
        state.isTraveling = true;
        const b = document.getElementById("travelBanner");
        b.textContent = `🚶 ${state.lang === "vi" ? "Đang đi bộ đến" : "Walking to"} ${state.lang === "vi" ? dest.shortVi : dest.shortEn}...`;
        b.classList.remove("hidden");
        const from = LOCATIONS[state.location];
        playerAnim.waypoints = [
          { x: from.doorX, y: 212 },
          { x: dest.doorX, y: 212 },
          { x: dest.doorX, y: dest.doorY },
        ];
        playerAnim.moving = true;
        playerAnim.onArrive = () => {
          state.isTraveling = false;
          state.location = destId;
          state.walkedThisShift = true;
          b.classList.add("hidden");
          spawnFloat("🚶 0.9x", "#f59e0b");
          saveGame();
          renderAll();
        };
      }

            b.className = `mg-tile h-20 rounded-xl text-4xl flex items-center justify-center ${it.good ? "bg-emerald-100 hover:bg-emerald-200" : "bg-rose-100 hover:bg-rose-200"}`;
            b.textContent = it.icon;
          }
        };
        const spawn = () => {
          if (done) return;
          for (let i = 0; i < 9; i++)
            if (cells[i] && Date.now() > cells[i].exp) {
              cells[i] = null;
              renderCell(i);
            }
          const empty = cells
            .map((c, i) => (c === null ? i : -1))
            .filter((i) => i >= 0);
          if (empty.length) {
            const i = empty[Math.floor(Math.random() * empty.length)];
            const good = Math.random() < 0.72;
            const pool = good ? boardCfg.good : boardCfg.bad;
            cells[i] = {
              good,
              icon: pool[Math.floor(Math.random() * pool.length)],
              exp: Date.now() + 1500,
            };
            renderCell(i);
          }
        };
        document.querySelectorAll("#mgGrid button").forEach((b) =>
          b.addEventListener("click", () => {
            if (done) return;
            const i = parseInt(b.dataset.i, 10),
              it = cells[i];
            if (!it) return;
            if (it.good) {
              score++;
              SFX.hit();
            } else {
              score = Math.max(0, score - 1);
              SFX.miss();
            }
            cells[i] = null;
            renderCell(i);
            document.getElementById("mgScore").textContent =
              `${score}/${target}`;
            if (score >= target) finish();
          }),
        );
        spawn();
        spawn();
        mgSpawn = setInterval(spawn, 460);
        mgInterval = setInterval(() => {
          timeLeft--;
          const el = document.getElementById("mgTime");
          if (el) el.textContent = timeLeft + "s";
          if (timeLeft <= 0) finish();
        }, 1000);
      }

      // ==================== 13. SHIFT COMPLETION, END OF DAY & LEVEL-UP GUIDES ====================
      function completeShift(job, ok, score, target) {
        const ev =
          MARKET_EVENTS.find((e) => e.id === state.eventId) || MARKET_EVENTS[0];
        const kSD = ev.mults[job.id] !== undefined ? ev.mults[job.id] : 1.0;
        const cnt = state.dailyJobCounts[job.id] || 0;
        const kDMR = [1.0, 0.55, 0.2][Math.min(cnt, 2)];
        const kMove = state.walkedThisShift ? 0.9 : 1.0;
        const kFit = state.isExhausted ? 0.8 : 1.0;
        const wBase =
          job.wBase + (state.perks.cert && job.group === "HIGH_TECH" ? 5 : 0);
        const mgMult = ok ? 1.0 : 0.8;
        const wage = Math.round(
          Math.round(wBase * kSD * kDMR * kMove * kFit) * mgMult,
        );

        state.dailyJobCounts[job.id] = cnt + 1;
        state.cash += wage;
        addTx(
          `Lương ${job.vi.name} (Ca ${state.shift})`,
          `${job.en.name} Wage (Shift ${state.shift})`,
          wage,
        );
        if (ok) SFX.coin();
        else SFX.miss();
        spawnFloat(`+${wage} Fi`, "#10b981");
        closeModal();
        showToast(
          `${job.icon} +${fmt(wage)} (${ok ? "100%" : "80%"} · DMR ${Math.round(kDMR * 100)}% · SD ×${kSD})`,
          ok ? "success" : "warn",
        );
        advanceShift(1);
      }

      function advanceShift(steps = 1) {
        if (checkLevelProgression()) {
          saveGame();
          renderAll();
          return;
        }
        state.walkedThisShift = false;
        state.shift += steps;
        if (state.shift > 3) {
          endOfDay();
          return;
        }
        saveGame();
        renderAll();
        if (
          state.level === 1 &&
          (state.shift === 2 || state.shift === 3) &&
          Math.random() < 0.45
        )
          triggerOppPopup();
      }

      function triggerOppPopup() {
        const pool = OPP_EVENTS.filter(
          (e) =>
            !(e.id === "hackathon" && state.shift !== 2) &&
            !(e.id === "cert" && state.perks.cert) &&
            !(e.id === "workshop" && state.perks.workshop),
        );
        if (!pool.length) return;
        const ev = pool[Math.floor(Math.random() * pool.length)];
        const canPay = state.cash >= ev.fee;
        openModal(
          `
    <span class="px-2 py-0.5 rounded-full text-[10px] font-bold bg-purple-100 text-purple-800 border border-purple-400">⚡ OPPORTUNITY COST • ${t("shift")} ${state.shift}</span>
    <h3 class="font-retro font-bold text-lg text-slate-900 mt-1.5">${ev.icon} ${ev[state.lang].title}</h3>
    <p class="text-xs sm:text-sm text-slate-700 my-2.5">${ev[state.lang].desc}</p>
    <div class="grid grid-cols-2 gap-2.5">
      <button id="oppNo" class="pixel-btn py-2 bg-slate-200 text-slate-800 text-xs">${t("cancel")}</button>
      <button id="oppYes" ${!canPay ? "disabled" : ""} class="pixel-btn py-2 bg-purple-600 text-white text-xs">${t("confirm")} (${ev.fee > 0 ? "-" + ev.fee + " Fi" : "0 Fi"})</button>
    </div>
  `,
          false,
        );
        document.getElementById("oppNo").addEventListener("click", closeModal);
        document.getElementById("oppYes").addEventListener("click", () => {
          state.cash -= ev.fee;
          if (ev.fee > 0) addTx(ev.vi.title, ev.en.title, -ev.fee);
          if (ev.id === "hackathon") {
            state.perks.itBadge = true;
            if (Math.random() < 0.25) {
              state.cash += 80;
              addTx("Thắng Hackathon FiCity", "Won FiCity Hackathon", 80);
              showToast("🏆 +80 Fi + IT Badge!", "success");
            } else showToast("💻 +IT Badge (-10% LV2 upgrade)!", "info");
          } else if (ev.id === "cert") {
            state.perks.cert = true;
            showToast("🎓 +5 Fi AI Chip & Barista!", "success");
          } else if (ev.id === "delivery") {
            state.cash += 22;
            addTx("Giao hàng hộ bạn", "Friend delivery", 22);
            showToast("🛵 +22 Fi!", "success");
          } else if (ev.id === "workshop") {
            state.perks.workshop = true;
            showToast("📊 +10% Startup Revenue (LV2)!", "success");
          }
          SFX.coin();
          closeModal();
          advanceShift(ev.shifts);
        });
      }

      function endOfDay() {
        if (state.cash >= 15) {
          state.cash -= 15;
          state.nextDayExhausted = false;
          addTx("Chi phí sinh hoạt (24:00)", "Daily living cost (24:00)", -15);
        } else {
          state.cash = 0;
          state.nextDayExhausted = true;
          showToast(
            state.lang === "vi"
              ? "⚠️ Không đủ 15 Fi sinh hoạt! Ngày mai bị Kiệt sức (0.8x)."
              : "⚠️ Missed 15 Fi living cost! Exhausted (0.8x) tomorrow.",
            "error",
          );
        }

        if (state.debt > 0) {
          const intr = Math.max(1, Math.round(state.debt * state.loanRate));
          state.cash -= intr;
          addTx(
            `Lãi vay FiBank (${Math.round(state.loanRate * 100)}%)`,
            `FiBank Interest (${Math.round(state.loanRate * 100)}%)`,
            -intr,
          );
          if (state.cash < 0) {
            state.debt += Math.abs(state.cash);
            state.cash = 0;
          }
        }

        state.day++;
        state.shift = 1;
        state.location = "home";
        playerAnim.x = LOCATIONS.home.doorX;
        playerAnim.y = LOCATIONS.home.doorY;
        playerAnim.waypoints = [];
        playerAnim.moving = false;
        state.isExhausted = state.nextDayExhausted;
        state.nextDayExhausted = false;
        state.walkedThisShift = false;
        state.dailyJobCounts = {};
        state.eventId =
          MARKET_EVENTS[Math.floor(Math.random() * MARKET_EVENTS.length)].id;
        state.unreadNews = true;
        // Daily fluctuating supermarket prices for 3 chains
        state.market.supPrices = [
          +(2.6 + Math.random() * 1.4).toFixed(1),
          +(2.6 + Math.random() * 1.4).toFixed(1),
          +(2.6 + Math.random() * 1.4).toFixed(1),
        ];

        if (state.level === 3) advanceMarketDay();
        if (state.day > state.maxDays) {
          state.gameEnded = true;
          state.won = state.cash >= GOALS[3];
          recordRunToHistory(state.won ? "win" : "timeout");
          showEndModal();
          saveGame();
          renderAll();
          return;
        }
        checkLevelProgression();
        saveGame();
        renderAll();
      }

      function checkLevelProgression() {
        if (state.level === 1 && state.cash >= GOALS[1]) {
          state.level = 2;
          state.loanRate = 0.01;
          addLog(
            "🎉 Lên Level 2: Khởi nghiệp (Đạt ≥ 500 Fi)!",
            "🎉 Reached Level 2: Startup Founder (≥ 500 Fi)!",
          );
          SFX.win();
          openLevelGuideModal(2);
          return true;
        }
        if (state.level === 2 && state.cash >= GOALS[2]) {
          state.level = 3;
          state.location = "exchange";
          state.activePhoneApp = "stocks";
          initMarketFirstDay();
          addLog(
            "🚀 Lên Level 3: Sàn Chứng khoán FiSE (Đạt ≥ 4.000 Fi)!",
            "🚀 Reached Level 3: FiSE Stock Market (≥ 4,000 Fi)!",
          );
          SFX.win();
          openLevelGuideModal(3);
          return true;
        }
        if (state.level === 3 && state.cash >= GOALS[3] && !state.won) {
          state.won = true;
          state.gameEnded = true;
          recordRunToHistory("win");
          addLog(
            "🏆 Vượt 60.000 Fi — Chiến thắng FiLite!",
            "🏆 Exceeded 60,000 Fi — FiLite Victory!",
          );
          SFX.win();
          showEndModal();
          return true;
        }
        return false;
      }

      function operateAllStartups() {
        const ev =
          MARKET_EVENTS.find((e) => e.id === state.eventId) || MARKET_EVENTS[0];
        const ownedKeys = Object.keys(state.startups).filter(
          (k) => state.startups[k].owned,
        );
        if (!ownedKeys.length) return;

        // REQUIREMENT 1: Player MUST buy supplies at Supermarket first (NO auto-buying!)
        const missingStock = ownedKeys.filter(
          (k) =>
            (state.startups[k].stockBought || 0) +
              (state.startups[k].leftover || 0) <=
            0,
        );
        if (missingStock.length > 0) {
          showToast(t("needMartToast"), "error");
          SFX.miss();
          return;
        }

        let totalFixed = 0;
        const calcs = {};
        ownedKeys.forEach((k) => {
          const st = state.startups[k],
            def = STARTUP_DEFS[k];
          const fixedCost = def.locCost[st.loc] + (st.staff ? 50 : 0);
          totalFixed += fixedCost;
          calcs[k] = { fixedCost };
        });

        if (state.cash < totalFixed) {
          showToast(
            state.lang === "vi"
              ? `Cần ${fmt(totalFixed)} trả Chi phí cố định (Fixed Cost)! Hãy vay FiBank.`
              : `Need ${fmt(totalFixed)} for Fixed Costs! Borrow from FiBank.`,
            "error",
          );
          SFX.miss();
          return;
        }

        let totalNet = 0;
        const summary = [];
        ownedKeys.forEach((k) => {
          const st = state.startups[k],
            def = STARTUP_DEFS[k],
            c = calcs[k];
          let envMult = 1.0,
            shockNote = "";
          const rnd = Math.random();
          if (k === "lemonade") {
            envMult =
              ev.weather === "hot"
                ? 1.4
                : ev.weather === "rain" || ev.weather === "storm"
                  ? 0.45
                  : 1.0;
            if (rnd < 0.2) {
              envMult *= 0.65;
              shockNote =
                state.lang === "vi"
                  ? "Đối thủ giảm giá sát vách (-35%)"
                  : "Competitor price war (-35%)";
            } else if (rnd > 0.82) {
              envMult *= 1.3;
              shockNote =
                state.lang === "vi"
                  ? "Lễ hội bãi biển (+30%)"
                  : "Beach festival (+30%)";
            }
          } else if (k === "ficheck") {
            envMult =
              ev.weather === "storm" || ev.weather === "rain" ? 1.3 : 0.95;
            if (rnd < 0.22) {
              envMult *= 0.6;
              shockNote =
                state.lang === "vi"
                  ? "Khám miễn phí gần đó (-40%)"
                  : "Free community clinic nearby (-40%)";
            } else if (rnd > 0.8) {
              envMult *= 1.35;
              shockNote =
                state.lang === "vi"
                  ? "Giải Marathon FiCity (+35%)"
                  : "FiCity Marathon (+35%)";
            }
          } else if (k === "stufi") {
            envMult = state.day % 3 === 0 ? (st.upgrade ? 1.65 : 0.95) : 0.85;
            if (!st.upgrade && rnd < 0.3) {
              envMult *= 0.7;
              shockNote =
                state.lang === "vi"
                  ? "Phụ huynh phàn nàn chất lượng GV (-30%)"
                  : "Parent complaints on teaching (-30%)";
            }
          }

          // REQUIREMENT 2: Inspector fine increased by +40% (200 -> 280 Fi)
          let ratioMult = 1.0,
            fine = 0;
          if (k === "lemonade") {
            const rL = st.ratioLemon || 1,
              rS = st.ratioSugar || 1,
              rI = st.ratioIce || 1;
            if (rI >= 3 && rL <= 1) {
              fine = 280;
              ratioMult = 0.6;
              shockNote =
                state.lang === "vi"
                  ? "Quá nhiều đá! Thanh tra phạt 280 Fi!"
                  : "Too much ice! Inspector fined 280 Fi!";
            } else if (rL !== rS) {
              ratioMult = 0.75;
              shockNote =
                state.lang === "vi"
                  ? "Tỷ lệ chanh-đường lệch (-25% khách)"
                  : "Unbalanced lemon-sugar ratio (-25% demand)";
            }
          }

          const baseD = def.baseDemand[st.price] || 55;
          const dem = Math.round(
            baseD *
              def.tierMult[st.tier] *
              def.locMult[st.loc] *
              envMult *
              ratioMult *
              (st.quality === "premium" ? 1.2 : 1) *
              (st.repPenalty ? 0.7 : 1) *
              (st.staff ? 0.78 : 1) *
              (state.perks.workshop ? 1.1 : 1),
          );
          const avail = (st.stockBought || 0) + (st.leftover || 0);
          const sold = Math.min(dem, def.tierCap[st.tier], avail);
          const rev = Math.round(sold * st.price * (st.upgrade ? 1.2 : 1.0));
          st.repPenalty = false;
          if (st.quality === "economy" && Math.random() < 0.33) {
            fine += 280;
            st.repPenalty = true;
          }
          const remain = Math.max(0, avail - sold);
          st.stockBought = 0;
          st.leftover = k === "stufi" ? remain : Math.floor(remain * 0.25);
          const net = rev - c.fixedCost - fine;
          totalNet += net;
          st.lastReport = {
            day: state.day,
            sold,
            cap: def.tierCap[st.tier],
            rev,
            fixedCost: c.fixedCost,
            varCost: 0,
            eosSaved: 0,
            fine,
            net,
            shockNote,
          };
          summary.push({ key: k, ...st.lastReport });
        });

        state.cash += totalNet;
        state.lastCombinedStartupReport = {
          day: state.day,
          totalNet,
          items: summary,
        };
        addTx(
          `Lợi nhuận ${ownedKeys.length} Startup (Ngày ${state.day})`,
          `Profit from ${ownedKeys.length} Startup(s) (Day ${state.day})`,
          totalNet,
        );
        SFX[totalNet >= 0 ? "coin" : "miss"]();
        spawnFloat(
          `${totalNet >= 0 ? "+" : ""}${totalNet} Fi`,
          totalNet >= 0 ? "#10b981" : "#ef4444",
        );
        showToast(
          `${state.lang === "vi" ? "Tổng LN ròng" : "Total Net"}: ${totalNet >= 0 ? "+" : ""}${fmt(totalNet)}`,
          totalNet >= 0 ? "success" : "error",
        );
        state.shift = 3;
        advanceShift(1);
      }

      // ==================== 15. LEVEL 3 STOCK MARKET + CANDLESTICK CHART RENDERER ====================
      function initMarketFirstDay() {
        const sc = MARKET_SCRIPT[0];
        state.market.dayIndex = 0;
        state.market.sessionNum = 1;
        state.market.settledInsidersToday = [];
        state.market.todayExternalNews = sc.external;
        state.market.insiderTips = sc.insiderForTomorrow.map((x, idx) => ({
          ...x,
          id: state.day + "_" + idx,
          unlocked: false,
          receivedDay: state.day,
        }));
        state.market.unreadChat = true;
        applyCandleStep(sc.external);
      }

      function applyCandleStep(events) {
        const mapPct = {};
        events.forEach(
          (e) => (mapPct[e.stock] = (mapPct[e.stock] || 0) + e.pct),
        );
        STOCKS_DEF.forEach((s) => {
          const open = state.market.prices[s.id];
          const pct =
            mapPct[s.id] !== undefined
              ? mapPct[s.id]
              : Math.random() * 0.08 - 0.04;
          const close = Math.max(5, Math.round(open * (1 + pct)));
          const high = Math.max(open, close) + Math.ceil(Math.random() * 3);
          const low = Math.max(
            3,
            Math.min(open, close) - Math.ceil(Math.random() * 3),
          );
          state.market.prevPrices[s.id] = open;
          state.market.prices[s.id] = close;
          state.market.candles[s.id].push({
            day: state.day,
            o: open,
            h: high,
            l: low,
            c: close,
          });
          if (state.market.candles[s.id].length > 14)
            state.market.candles[s.id].shift();
        });
      }

      function advanceMarketDay() {
        if (state.market.frozenDays > 0) state.market.frozenDays--;
        state.market.fisecSuspicion = Math.max(
          0,
          state.market.fisecSuspicion - 10,
        );
        const settledInsiders = state.market.insiderTips || [];
        state.market.settledInsidersToday = settledInsiders;
        state.market.dayIndex =
          (state.market.dayIndex + 1) % MARKET_SCRIPT.length;
        state.market.sessionNum = (state.market.sessionNum || 1) + 1;
        const sc = MARKET_SCRIPT[state.market.dayIndex];
        applyCandleStep([...settledInsiders, ...sc.external]);
        state.market.todayExternalNews = sc.external;
        state.market.insiderTips = sc.insiderForTomorrow.map((x, idx) => ({
          ...x,
          id: state.day + "_" + idx,
          unlocked: false,
          receivedDay: state.day,
        }));
        state.market.unreadChat = true;

        const squeezeSet = new Set(
          sc.external.filter((e) => e.squeeze).map((e) => e.stock),
        );
        let hadSq = false,
          hadMC = false;
        state.market.positions = state.market.positions.filter((pos) => {
          const p = state.market.prices[pos.stock];
          if (pos.side === "short")
            state.cash = Math.max(
              0,
              state.cash -
                Math.max(1, Math.round(pos.entry * pos.shares * 0.01)),
            );
          const pnl =
            (pos.side === "long" ? p - pos.entry : pos.entry - p) * pos.shares;
          if (pos.side === "short" && squeezeSet.has(pos.stock)) {
            hadSq = true;
            addLog(
              `🔥 SHORT SQUEEZE cháy lệnh ${pos.stock}!`,
              `🔥 SHORT SQUEEZE crushed ${pos.stock} short!`,
            );
            return false;
          }
          if (pnl <= -pos.margin * 0.95) {
            hadMC = true;
            addLog(
              `💥 MARGIN CALL thanh lý ${pos.stock}!`,
              `💥 MARGIN CALL liquidated ${pos.stock}!`,
            );
            return false;
          }
          return true;
        });
        if (hadSq) {
          showToast(
            "🔥 SHORT SQUEEZE! Giá tăng sốc cháy lệnh bán khống!",
            "error",
          );
          SFX.miss();
        } else if (hadMC) {
          showToast("💥 MARGIN CALL! Cháy lệnh đòn bẩy!", "error");
          SFX.miss();
        }
      }

      function drawCandlestickCanvas(canvasId, stockId) {
        const c = document.getElementById(canvasId);
        if (!c) return;
        const ctx2 = c.getContext("2d");
        const W = (c.width = Math.max(240, c.parentElement.clientWidth || 320));
        const H = (c.height = Math.max(
          130,
          c.parentElement.clientHeight || 160,
        ));
        const data = state.market.candles[stockId] || [];
        if (!data.length) return;

       // Dark trading terminal background
ctx2.fillStyle = "#0f172a";
ctx2.fillRect(0, 0, W, H);

let minP = Infinity;
let maxP = -Infinity;

data.forEach((d) => {
  if (d.l < minP) minP = d.l;
  if (d.h > maxP) maxP = d.h;
});

const pad = Math.max(3, (maxP - minP) * 0.15);
minP = Math.max(0, minP - pad);
maxP += pad;

const span = Math.max(1, maxP - minP);

// Horizontal grid lines & price labels
ctx2.strokeStyle = "rgba(148,163,184,0.15)";
ctx2.lineWidth = 1;
ctx2.fillStyle = "#94a3b8";
ctx2.font = "10px 'Chakra Petch', sans-serif";
ctx2.textAlign = "right";

for (let i = 0; i <= 4; i++) {
  const y = 14 + ((H - 28) * i) / 4;
  const priceVal = Math.round(maxP - (span * i) / 4);

  ctx2.beginPath();
  ctx2.moveTo(8, y);
  ctx2.lineTo(W - 34, y);
  ctx2.stroke();
  ctx2.fillText(priceVal + "", W - 4, y + 3);
}

        // Draw Japanese Candlesticks (Green = Up, Red = Down!)
        const plotW = W - 44;
        const step = plotW / Math.max(data.length, 6);
        const bodyW = Math.max(6, Math.min(18, step * 0.58));
        const yOf = (val) => 14 + ((maxP - val) / span) * (H - 28);

        data.forEach((d, idx) => {
          const cx = 14 + idx * step + step / 2;
          const isUp = d.c >= d.o;
          const col = isUp ? "#10b981" : "#ef4444";
          // Wick (High to Low)
          ctx2.strokeStyle = col;
          ctx2.lineWidth = 2;
          ctx2.beginPath();
          ctx2.moveTo(cx, yOf(d.h));
          ctx2.lineTo(cx, yOf(d.l));
          ctx2.stroke();
          // Body (Open to Close)
          const yTop = yOf(Math.max(d.o, d.c));
          const yBot = yOf(Math.min(d.o, d.c));
          ctx2.fillStyle = col;
          ctx2.fillRect(cx - bodyW / 2, yTop, bodyW, Math.max(3, yBot - yTop));
        });
      }

      function buySpotStock(shId) {
        if (state.level < 3) {
          showToast(t("lv3LockedNote"), "warn");
          return;
        }
        if (state.market.frozenDays > 0) {
          showToast("🚨 FiSEC freeze active!", "error");
          return;
        }
        const sid = state.market.selectedStock,
          price = state.market.prices[sid];
        const sh = parseInt(document.getElementById(shId)?.value, 10) || 0;
        if (sh <= 0) return;
        const cost = price * sh;
        if (cost > state.cash) {
          showToast(t("notEnough"), "error");
          SFX.miss();
          return;
        }
        const hasIns = (state.market.insiderTips || []).some(
          (tip) => tip.stock === sid,
        );
        if (hasIns && cost / Math.max(1, state.cash) >= 0.4)
          state.market.fisecSuspicion = Math.min(
            100,
            state.market.fisecSuspicion + 28,
          );
        state.cash -= cost;
        const h = state.market.holdings[sid] || {
          shares: 0,
          avgCost: 0,
          insiderFlag: false,
        };
        const newTotal = h.shares + sh;
        h.avgCost = Math.round((h.shares * h.avgCost + cost) / newTotal);
        h.shares = newTotal;
        if (hasIns) h.insiderFlag = true;
        state.market.holdings[sid] = h;
        addTx(
          `Mua ${sh} CP ${sid} (@${price} Fi)`,
          `Bought ${sh} ${sid} (@${price} Fi)`,
          -cost,
        );
        SFX.coin();
        saveGame();
        renderAll();
      }

      function sellSpotStock(shId) {
        if (state.level < 3) {
          showToast(t("lv3LockedNote"), "warn");
          return;
        }
        const sid = state.market.selectedStock,
          price = state.market.prices[sid];
        const h = state.market.holdings[sid];
        if (!h || h.shares <= 0) {
          showToast(
            state.lang === "vi"
              ? "Bạn chưa nắm giữ cổ phiếu này!"
              : "You own 0 shares of this stock!",
            "warn",
          );
          return;
        }
        const req = parseInt(document.getElementById(shId)?.value, 10) || 0;
        const sh = Math.min(req, h.shares);
        if (sh <= 0) return;
        let proceeds = sh * price;
        const pnl = (price - h.avgCost) * sh;
        if (h.insiderFlag && pnl > 0 && state.market.fisecSuspicion >= 75) {
          const fine = Math.round(pnl * 0.35);
          proceeds = Math.max(0, proceeds - fine);
          state.market.frozenDays = 1;
          state.market.fisecSuspicion = 30;
          showToast(`🚨 FiSEC phạt -${fmt(fine)}!`, "error");
        } else {
          showToast(
            `${sid} ${pnl >= 0 ? "+" : ""}${fmt(pnl)}`,
            pnl >= 0 ? "success" : "warn",
          );
        }
        state.cash += proceeds;
        h.shares -= sh;
        if (h.shares <= 0) delete state.market.holdings[sid];
        addTx(
          `Bán ${sh} CP ${sid} (@${price} Fi)`,
          `Sold ${sh} ${sid} (@${price} Fi)`,
          proceeds,
        );
        SFX.coin();
        checkLevelProgression();
        saveGame();
        renderAll();
      }

      function openStockOrder(side, levId, shId) {
        if (state.level < 3) {
          showToast(t("lv3LockedNote"), "warn");
          return;
        }
        if (state.market.frozenDays > 0) {
          showToast("🚨 FiSEC freeze active!", "error");
          return;
        }
        const sid = state.market.selectedStock,
          price = state.market.prices[sid];
        const lev = parseInt(document.getElementById(levId)?.value, 10) || 1;
        const sh = parseInt(document.getElementById(shId)?.value, 10) || 0;
        if (sh <= 0) return;
        const margin = Math.ceil((price * sh) / lev);
        if (margin > state.cash) {
          showToast(t("notEnough"), "error");
          SFX.miss();
          return;
        }

        const hasIns = (state.market.insiderTips || []).some(
          (tip) => tip.stock === sid,
        );
        if (hasIns && (margin / Math.max(1, state.cash) >= 0.35 || lev >= 5)) {
          state.market.fisecSuspicion = Math.min(
            100,
            state.market.fisecSuspicion + Math.round(25 + lev * 2),
          );
        }
        state.cash -= margin;
        const liqPrice =
          side === "long"
            ? Math.max(1, Math.round(price * (1 - 0.95 / lev)))
            : Math.round(price * (1 + 0.95 / lev));
        state.market.positions.push({
          id: Date.now() + Math.random(),
          stock: sid,
          side,
          shares: sh,
          entry: price,
          leverage: lev,
          margin,
          liqPrice,
          insiderFlag: hasIns,
        });
        addTx(
          `Mở ${side.toUpperCase()} ${sh} ${sid} (x${lev})`,
          `Opened ${side.toUpperCase()} ${sh} ${sid} (x${lev})`,
          -margin,
        );
        SFX.click();
        saveGame();
        renderAll();
      }

      function closeStockOrder(posId) {
        const idx = state.market.positions.findIndex((p) => p.id === posId);
        if (idx === -1) return;
        const pos = state.market.positions[idx],
          curP = state.market.prices[pos.stock];
        let pnl = Math.round(
          (pos.side === "long" ? curP - pos.entry : pos.entry - curP) *
            pos.shares,
        );
        let payout = Math.max(0, pos.margin + pnl);
        if (pos.insiderFlag && pnl > 0 && state.market.fisecSuspicion >= 75) {
          const fine = Math.round(pnl * 0.35);
          payout = Math.max(0, payout - fine);
          state.market.frozenDays = 1;
          state.market.fisecSuspicion = 30;
          showToast(`🚨 FiSEC phạt -${fmt(fine)}!`, "error");
          SFX.miss();
        } else {
          showToast(
            `${pos.stock}: ${pnl >= 0 ? "+" : ""}${fmt(pnl)}`,
            pnl >= 0 ? "success" : "warn",
          );
          SFX.coin();
        }
        state.cash += payout;
        state.market.positions.splice(idx, 1);
        addTx(
          `Chốt ${pos.side.toUpperCase()} ${pos.stock} (${pnl >= 0 ? "+" : ""}${pnl} Fi)`,
          `Closed ${pos.side.toUpperCase()} ${pos.stock} (${pnl >= 0 ? "+" : ""}${pnl} Fi)`,
          payout,
        );
        checkLevelProgression();
        saveGame();
        renderAll();
      }

      function openPhoneApp(id) {
        if (id === "chat" && state.level < 3) {
          SFX.miss();
          showToast(t("lockedAppMsg")("FiChat", 3), "warn");
          return;
        }
        if (id === "stocks" && state.level < 3) {
          SFX.miss();
          showToast(t("lockedAppMsg")("FiStock", 3), "warn");
          return;
        }
        if (id === "corps" && state.level < 3) {
          SFX.miss();
          showToast(
            t("lockedAppMsg")(state.lang === "vi" ? "Hồ sơ Cty" : "FiCorps", 3),
            "warn",
          );
          return;
        }
        SFX.click();
        if (id === "news") state.unreadNews = false;
        state.activePhoneApp = id;
        renderAll();
      }

      function toggleMobilePhone(show) {
        const c = document.getElementById("phoneContainer");
        const b = document.getElementById("mobilePhoneBackdrop");
        const fab = document.getElementById("mobilePhoneFab");
        if (!c || !b || !fab) return;
        if (show) {
          c.classList.remove("hidden");
          if (window.innerWidth < 1024) {
            c.classList.add("fixed", "inset-x-3", "top-14", "z-40");
            b.classList.remove("hidden");
          } else {
            c.classList.remove("fixed", "inset-x-3", "top-14", "z-40");
            b.classList.add("hidden");
            fab.classList.add("lg:hidden");
          }
          SFX.click();
        } else {
          c.classList.add("hidden");
          c.classList.remove("fixed", "inset-x-3", "top-14", "z-40");
          b.classList.add("hidden");
          fab.classList.remove("hidden", "lg:hidden");
          SFX.click();
        }
      }

      async function openLeaderboardModal() {
        const L = T[state.lang];
        const isVi = state.lang === "vi";

          live: false,
        }));
        if (state.initialized) {
          localEntries.push({

        localEntries.sort((a, b) => b.cash - a.cash);

        const renderRows = (rows, isOnline) => {
          const medals = ["🥇", "🥈", "🥉"];
          const badge = isOnline

      <div class="flex justify-between items-center border-b-2 border-slate-200 pb-2 mb-2">

          closeModal();
          state = defaultState();
          document.getElementById("setupOverlay").classList.remove("hidden");
          renderSetup();
        });
      });

      window.onload = () => {
        setupCanvas();
        requestAnimationFrame(gameLoop);
        const s = loadGame();
        if (s && s.initialized) state.lang = s.lang || "vi";
        renderAll();
        renderSetup();
      };
    </script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="./script.js"></script>
