<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MegaValue - Siêu Thị Nguyên Liệu</title>
    <link
      href="https://fonts.googleapis.com/css2?family=VT323&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        box-sizing: border-box;
        user-select: none;
      }

      body {
        margin: 0;
        padding: 0;
        background-color: #1a1c2c;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        font-family: "VT323", monospace;
        overflow: hidden;
      }

      /* Khung game 800x600 chuẩn Pixel Retro */
      #game-container {
        position: relative;
        width: 800px;
        height: 600px;
        border: 6px solid #111;
        box-shadow:
          0 0 0 4px #9b59b6,
          0 20px 40px rgba(0, 0, 0, 0.8);
        background-color: #f0f3f8;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }

      /* 1. THANH TRÊN CÙNG */
      .top-bar {
        height: 50px;
        background-color: #1a1c2c;
        border-bottom: 4px solid #111;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 20px;
        color: #fff;
        font-size: 24px;
      }

      .badge-money {
        background-color: #4caf50;
        padding: 2px 10px;
        border: 2px solid #111;
        box-shadow: 2px 2px 0 #111;
      }

      .btn-back {
        background-color: #e74c3c;
        color: #fff;
        border: 2px solid #111;
        padding: 2px 14px;
        font-family: "VT323", monospace;
        font-size: 22px;
        cursor: pointer;
        box-shadow: 2px 2px 0 #111;
      }
      .btn-back:active {
        transform: translateY(2px);
        box-shadow: 0 0 0 #111;
      }

      /* 2. KHU VỰC CHÍNH (CỬA HÀNG & KHO ĐỒ) */
      .shop-layout {
        flex: 1;
        display: flex;
        padding: 15px;
        gap: 15px;
        background: #e2e8f0;
        overflow: hidden;
      }

      /* Bảng hàng hóa */
      .shelf-container {
        flex: 2;
        background: #fff;
        border: 4px solid #111;
        box-shadow: 4px 4px 0 rgba(0, 0, 0, 0.2);
        padding: 15px;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
        overflow-y: auto;
      }

      .item-card {
        background: #f8f9fa;
        border: 3px solid #333;
        padding: 10px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        box-shadow: 2px 2px 0 #333;
      }

      .item-info {
        display: flex;
        flex-direction: column;
      }

      .item-name {
        font-size: 22px;
        font-weight: bold;
        color: #1d266b;
      }

      .item-price {
        font-size: 18px;
        color: #c0392b;
      }

      .item-action {
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .item-action input {
        width: 45px;
        font-family: "VT323", monospace;
        font-size: 20px;
        text-align: center;
        border: 2px solid #111;
      }

      .btn-buy {
        background-color: #ffde00;
        color: #111;
        border: 2px solid #111;
        padding: 2px 10px;
        font-family: "VT323", monospace;
        font-size: 20px;
        font-weight: bold;
        cursor: pointer;
        box-shadow: 2px 2px 0 #111;
      }
      .btn-buy:hover {
        background-color: #ffee55;
      }
      .btn-buy:active {
        transform: translateY(2px);
        box-shadow: 0 0 0 #111;
      }

      /* Bảng giỏ hàng / Tủ đồ cá nhân */
      .inventory-panel {
        flex: 1;
        background: #1d266b;
        border: 4px solid #111;
        color: #fff;
        padding: 15px;
        display: flex;
        flex-direction: column;
        box-shadow: 4px 4px 0 rgba(0, 0, 0, 0.2);
      }

      .inventory-title {
        font-size: 24px;
        color: #ffde00;
        border-bottom: 2px dashed #ffde00;
        padding-bottom: 5px;
        margin-bottom: 10px;
        text-transform: uppercase;
      }

      .inventory-list {
        flex: 1;
        overflow-y: auto;
        font-size: 20px;
      }

      .inv-item {
        display: flex;
        justify-content: space-between;
        background: rgba(255, 255, 255, 0.1);
        padding: 4px 8px;
        margin-bottom: 6px;
        border: 1px solid rgba(255, 255, 255, 0.2);
      }

      /* Thông báo trạng thái */
      .notification-bar {
        height: 40px;
        background-color: #111;
        color: #ffde00;
        display: flex;
        align-items: center;
        padding: 0 20px;
        font-size: 20px;
      }
    </style>
  </head>
  <body>
    <div id="game-container">
      <!-- THANH TRÊN CÙNG -->
      <div class="top-bar">
        <div>🏬 <b>MegaValue Supermarket</b></div>
        <div style="display: flex; align-items: center; gap: 15px">
          <span class="badge-money"
            >💰 $<span id="balance-display">100.00</span></span
          >
          <button class="btn-back" onclick="goToMap()">⬅ Về Bản Đồ</button>
        </div>
      </div>

      <!-- KHU VỰC MUA SẮM -->
      <div class="shop-layout">
        <!-- Kệ hàng hóa -->
        <div class="shelf-container" id="shelf-box">
          <!-- Được tạo tự động bằng JavaScript -->
        </div>

        <!-- Tủ đồ / Giỏ hàng của bạn -->
        <div class="inventory-panel">
          <div class="inventory-title">📦 KHO ĐỒ CỦA BẠN</div>
          <div class="inventory-list" id="inventory-list">
            <!-- Danh sách đồ trong kho -->
          </div>
        </div>
      </div>

      <!-- THANH THÔNG BÁO -->
      <div class="notification-bar" id="notification-text">
        Chào mừng bạn đến với Siêu thị MegaValue! Hãy chọn nguyên liệu cần mua.
      </div>
    </div>

    <script>
      // 1. DỮ LIỆU TÀI CHÍNH VÀ KHO ĐỒ
      let balance = parseFloat(localStorage.getItem("playerBalance")) || 15.0;
      let inventory = JSON.parse(localStorage.getItem("playerInventory")) || {};

      document.getElementById("balance-display").textContent =
        balance.toFixed(2);

      // Danh sách mặt hàng nguyên liệu chuẩn (Giá từ $0.5 đến $2.0)
      const shopItems = [
        { id: "lemon", name: "🍋 Chanh Tươi (Kg)", price: 1.2 },
        { id: "sugar", name: "🧂 Đường Trắng (Kg)", price: 1.0 },
        { id: "cup", name: "🥤 Cốc Giấy (Hộp 10c)", price: 0.8 },
        { id: "straw", name: "🥤 Ống Hút (Bịch 50c)", price: 0.5 },
        { id: "flour", name: "🌾 Bột Mì (Kg)", price: 1.5 },
        { id: "honey", name: "🍯 Mật Ong Nguyên Chất", price: 2.0 },
        { id: "cookie", name: "🍪 Bánh Quy (Hộp)", price: 1.6 },
        { id: "bag", name: "🛍️ Túi Giấy Đựng (10c)", price: 0.9 },
      ];

      // 2. HIỂN THỊ KỆ HÀNG
      function renderShop() {
        const shelfBox = document.getElementById("shelf-box");
        shelfBox.innerHTML = "";

        shopItems.forEach((item) => {
          shelfBox.innerHTML += `
                <div class="item-card">
                    <div class="item-info">
                        <span class="item-name">${item.name}</span>
                        <span class="item-price">$${item.price.toFixed(2)}</span>
                    </div>
                    <div class="item-action">
                        <input type="number" id="qty-${item.id}" value="1" min="1" max="99">
                        <button class="btn-buy" onclick="buyItem('${item.id}', ${item.price}, '${item.name}')">Mua</button>
                    </div>
                </div>
            `;
        });
      }

      // 3. HIỂN THỊ KHO ĐỒ
      function renderInventory() {
        const invList = document.getElementById("inventory-list");
        invList.innerHTML = "";

        const keys = Object.keys(inventory);
        if (keys.length === 0) {
          invList.innerHTML =
            '<div style="color: #aaa; text-align: center; margin-top: 20px;">Kho đồ trống</div>';
          return;
        }

        keys.forEach((key) => {
          if (inventory[key] > 0) {
            invList.innerHTML += `
                    <div class="inv-item">
                        <span>${key}</span>
                        <span><b>x${inventory[key]}</b></span>
                    </div>
                `;
          }
        });
      }

      // 4. XỬ LÝ MUA HÀNG
      function buyItem(itemId, itemPrice, itemName) {
        const qtyInput = document.getElementById(`qty-${itemId}`);
        const quantity = parseInt(qtyInput.value);

        if (isNaN(quantity) || quantity <= 0) {
          showNotification("Số lượng mua không hợp lệ!");
          return;
        }

        const totalCost = itemPrice * quantity;

        if (balance < totalCost) {
          showNotification(
            `❌ Không đủ tiền! Cần $${totalCost.toFixed(2)} nhưng bạn chỉ có $${balance.toFixed(2)}.`,
          );
          return;
        }

        // Trừ tiền
        balance -= totalCost;
        localStorage.setItem("playerBalance", balance.toFixed(2));
        document.getElementById("balance-display").textContent =
          balance.toFixed(2);

        // Thêm vào kho đồ
        if (!inventory[itemName]) {
          inventory[itemName] = 0;
        }
        inventory[itemName] += quantity;
        localStorage.setItem("playerInventory", JSON.stringify(inventory));

        renderInventory();
        showNotification(
          `✅ Đã mua thành công ${quantity}x ${itemName} với giá $${totalCost.toFixed(2)}!`,
        );
      }

      function showNotification(text) {
        document.getElementById("notification-text").textContent = text;
      }

      function goToMap() {
        window.location.href = "map.html";
      }

      // Khởi chạy khi tải trang
      renderShop();
      renderInventory();
    </script>
  </body>
</html>
