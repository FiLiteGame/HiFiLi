<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hệ Thống Mục Tiêu - Goals & Achievements</title>
    <link
      href="https://fonts.googleapis.com/css2?family=VT323&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        box-sizing: border-box;
        user-select: none;
      }

      body {
        margin: 0;
        padding: 0;
        background-color: #1a1c2c;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        font-family: "VT323", monospace;
        overflow: hidden;
      }

      #game-container {
        position: relative;
        width: 800px;
        height: 600px;
        border: 6px solid #111;
        box-shadow:
          0 0 0 4px #e67e22,
          0 20px 40px rgba(0, 0, 0, 0.8);
        background-color: #f0f3f8;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }

      /* 1. THANH TRÊN CÙNG */
      .top-bar {
        height: 50px;
        background-color: #1a1c2c;
        border-bottom: 4px solid #111;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 20px;
        color: #fff;
        font-size: 24px;
      }

      .badge-money {
        background-color: #4caf50;
        padding: 2px 10px;
        border: 2px solid #111;
        box-shadow: 2px 2px 0 #111;
      }

      .btn-back {
        background-color: #e74c3c;
        color: #fff;
        border: 2px solid #111;
        padding: 2px 14px;
        font-family: "VT323", monospace;
        font-size: 22px;
        cursor: pointer;
        box-shadow: 2px 2px 0 #111;
      }
      .btn-back:active {
        transform: translateY(2px);
        box-shadow: 0 0 0 #111;
      }

      /* 2. KHU VỰC CHÍNH */
      .goal-layout {
        flex: 1;
        display: flex;
        flex-direction: column;
        padding: 15px;
        gap: 15px;
        background: #e2e8f0;
        overflow-y: auto;
      }

      .level-banner {
        background: #f1c40f;
        border: 3px solid #111;
        padding: 10px 15px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        box-shadow: 3px 3px 0 #111;
      }

      .level-title {
        font-size: 26px;
        color: #111;
        font-weight: bold;
      }

      /* Thẻ mục tiêu */
      .goal-card {
        background: #fff;
        border: 3px solid #333;
        padding: 15px;
        display: flex;
        flex-direction: column;
        gap: 10px;
        box-shadow: 3px 3px 0 rgba(0, 0, 0, 0.2);
      }

      .goal-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 22px;
        color: #1d266b;
      }

      /* Thanh tiến độ tổng */
      .progress-container {
        background: #ddd;
        border: 2px solid #111;
        height: 22px;
        position: relative;
        width: 100%;
      }

      .progress-bar {
        background: #2ecc71;
        height: 100%;
        width: 0%;
        transition: width 0.4s ease;
      }

      .progress-text {
        position: absolute;
        width: 100%;
        text-align: center;
        top: 0;
        font-size: 18px;
        color: #111;
        font-weight: bold;
      }

      /* Danh sách mốc nhỏ (Milestones) */
      .milestones-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 10px;
        margin-top: 5px;
      }

      .milestone-box {
        background: #f8f9fa;
        border: 2px solid #555;
        padding: 8px;
        text-align: center;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .milestone-box.completed {
        background: #d4edda;
        border-color: #28a745;
      }

      .milestone-box.claimed {
        background: #e2e3e5;
        border-color: #6c757d;
        opacity: 0.7;
      }

      .btn-claim {
        background-color: #f39c12;
        color: #fff;
        border: 2px solid #111;
        padding: 2px 6px;
        font-family: "VT323", monospace;
        font-size: 18px;
        cursor: pointer;
        box-shadow: 2px 2px 0 #111;
      }
      .btn-claim:hover {
        background-color: #f1c40f;
        color: #111;
      }
      .btn-claim:active {
        transform: translateY(2px);
        box-shadow: 0 0 0 #111;
      }
      .btn-claim:disabled {
        background-color: #bdc3c7;
        color: #7f8c8d;
        cursor: not-allowed;
        box-shadow: none;
      }

      /* Thanh thông báo */
      .notification-bar {
        height: 40px;
        background-color: #111;
        color: #ffde00;
        display: flex;
        align-items: center;
        padding: 0 20px;
        font-size: 20px;
      }
    </style>
  </head>
  <body>
    <div id="game-container">
      <!-- THANH TRÊN CÙNG -->
      <div class="top-bar">
        <div>🏆 <b>Hệ Thống Mục Tiêu</b></div>
        <div style="display: flex; align-items: center; gap: 15px">
          <span class="badge-money"
            >💰 $<span id="balance-display">15.00</span></span
          >
          <button class="btn-back" onclick="goToMap()">⬅ Về Bản Đồ</button>
        </div>
      </div>

      <!-- NỘI DUNG CHÍNH -->
      <div class="goal-layout" id="goal-layout-box">
        <!-- ĐƯỢC TẠO TỰ ĐỘNG BẰNG JAVASCRIPT -->
      </div>

      <!-- THANH THÔNG BÁO -->
      <div class="notification-bar" id="notification-text">
        Hoàn thành các mốc nhỏ để nhận thưởng thêm tiền mặt và mở khóa Level cao
        hơn!
      </div>
    </div>

    <script>
      // 1. DỮ LIỆU TÀI CHÍNH & TIẾN ĐỘ
      let balance = parseFloat(localStorage.getItem("playerBalance")) || 15.0;

      // Tổng doanh thu kiếm được từ trước đến nay (dùng để tính tiến độ mục tiêu)
      // Bạn có thể đồng bộ biến này từ tổng số tiền người chơi đã kiếm được trong game.
      let totalEarned =
        parseFloat(localStorage.getItem("playerTotalEarned")) || 250.0;

      // Trạng thái nhận thưởng mốc: lưu dạng JSON { levelIndex_milestoneIndex: true }
      let claimedMilestones =
        JSON.parse(localStorage.getItem("claimedMilestones")) || {};

      document.getElementById("balance-display").textContent =
        balance.toFixed(2);

      // 2. CẤU TRÚC CÁC LEVEL VÀ MỤC TIÊU
      const goalLevels = [
        {
          level: 1,
          name: "Chủ Quầy Tập Sự",
          target: 2000,
          milestones: [
            { threshold: 100, reward: 100 },
            { threshold: 400, reward: 100 },
            { threshold: 800, reward: 100 },
            { threshold: 1500, reward: 100 },
          ],
        },
        {
          level: 2,
          name: "Thương Gia Phố Thị",
          target: 5000,
          milestones: [
            { threshold: 2200, reward: 250 },
            { threshold: 2800, reward: 250 },
            { threshold: 3600, reward: 250 },
            { threshold: 4500, reward: 250 },
          ],
        },
        {
          level: 3,
          name: "Ông Trùm Đồ Uống",
          target: 12000,
          milestones: [
            { threshold: 6000, reward: 500 },
            { threshold: 8000, reward: 500 },
            { threshold: 10000, reward: 500 },
            { threshold: 11500, reward: 500 },
          ],
        },
      ];

      // 3. HIỂN THỊ GIAO DIỆN MỤC TIÊU
      function renderGoals() {
        const layoutBox = document.getElementById("goal-layout-box");
        layoutBox.innerHTML = "";

        goalLevels.forEach((gLevel, lIndex) => {
          // Tính % hoàn thành của level này dựa trên totalEarned
          // (Ví dụ level 1 chạy từ 0 đến 2000)
          let prevTarget = lIndex === 0 ? 0 : goalLevels[lIndex - 1].target;
          let currentProgress = Math.max(
            0,
            Math.min(totalEarned - prevTarget, gLevel.target - prevTarget),
          );
          let spanRange = gLevel.target - prevTarget;
          let percent = Math.floor((currentProgress / spanRange) * 100);
          if (totalEarned >= gLevel.target) percent = 100;

          // Kiểm tra xem level này đã được mở khóa chưa (Level trước phải hoàn thành hoặc đạt mốc)
          let isUnlocked =
            lIndex === 0 || totalEarned >= goalLevels[lIndex - 1].target;

          let htmlMilestones = "";
          gLevel.milestones.forEach((m, mIndex) => {
            let key = `${lIndex}_${mIndex}`;
            let isReached = totalEarned >= m.threshold;
            let isClaimed = claimedMilestones[key];

            let statusClass = "";
            let btnText = `Thưởng $${m.reward}`;
            let isDisabled = true;

            if (isClaimed) {
              statusClass = "claimed";
              btnText = "Đã nhận";
              isDisabled = true;
            } else if (isReached) {
              statusClass = "completed";
              btnText = `Nhận $${m.reward}`;
              isDisabled = false;
            } else {
              statusClass = "";
              btnText = `Mốc $${m.threshold}`;
              isDisabled = true;
            }

            htmlMilestones += `
              <div class="milestone-box ${statusClass}">
                <div style="font-size: 16px; font-weight: bold;">Mốc: $${m.threshold}</div>
                <div style="font-size: 14px; color: #555;">Thưởng: +$${m.reward}</div>
                <button class="btn-claim" ${isDisabled ? "disabled" : ""} onclick="claimReward(${lIndex}, ${mIndex}, ${m.reward})">${btnText}</button>
              </div>
            `;
          });

          layoutBox.innerHTML += `
            <div class="level-banner" style="${!isUnlocked ? "opacity: 0.5; background: #95a5a6;" : ""}">
              <div class="level-title">⭐ LEVEL ${gLevel.level}: ${gLevel.name}</div>
              <div style="font-size: 20px;">Mục tiêu lớn: $${gLevel.target}</div>
            </div>

            <div class="goal-card" style="${!isUnlocked ? "opacity: 0.6; pointer-events: none;" : ""}">
              <div class="goal-header">
                <span>Tiến độ tổng doanh thu: <b>$${totalEarned.toFixed(0)}</b> / $${gLevel.target}</span>
                <span>${isUnlocked ? (percent >= 100 ? "✅ Hoàn thành Level" : "🔥 Đang thực hiện") : "🔒 Đã khóa"}</span>
              </div>
              
              <div class="progress-container">
                <div class="progress-bar" style="width: ${percent}%;"></div>
                <div class="progress-text">${percent}%</div>
              </div>

              <div style="font-size: 20px; margin-top: 5px;">🎁 Các mốc phần thưởng nhỏ:</div>
              <div class="milestones-grid">
                ${htmlMilestones}
              </div>
            </div>
          `;
        });
      }

      // 4. NHẬN THƯỞNG MỐC NHỎ
      function claimReward(lIndex, mIndex, rewardAmount) {
        let key = `${lIndex}_${mIndex}`;
        if (claimedMilestones[key]) return;

        // Đánh dấu đã nhận
        claimedMilestones[key] = true;
        localStorage.setItem(
          "claimedMilestones",
          JSON.stringify(claimedMilestones),
        );

        // Cộng tiền vào tài khoản chung
        balance += rewardAmount;
        localStorage.setItem("playerBalance", balance.toFixed(2));
        document.getElementById("balance-display").textContent =
          balance.toFixed(2);

        showNotification(
          `🎉 Nhận thành công +$${rewardAmount} tiền thưởng mốc mục tiêu!`,
        );
        renderGoals();
      }

      function showNotification(text) {
        document.getElementById("notification-text").textContent = text;
      }

      function goToMap() {
        window.location.href = "map.html";
      }

      // Khởi chạy giao diện
      renderGoals();
    </script>
  </body>
</html>
